[Definition]
# The regex must match the JSON structure on a single line
failregex = ^\{.*"ClientHost":"<HOST>".*"DownstreamStatus":(401|403|404)

# This pattern matches your specific JSON time format: "2026-02-17T04:18:30Z"
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"

# Some versions of Fail2Ban require specific handling for JSON
backend = auto

# Ensure the filter doesn't get hung up on the JSON overhead
ignoreregex =