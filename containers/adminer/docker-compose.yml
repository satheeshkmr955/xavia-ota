services:
  xavia-ota-adminer:
    image: adminer:5.3.0
    env_file: ../../.env
    container_name: xavia-ota-adminer
    restart: unless-stopped
    networks:
      - xavia_default
    ports:
      - 8082:8080
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.adminer.rule=Host(`adminer.${DOMAIN}`)'
      - 'traefik.http.routers.adminer.entrypoints=websecure'
      - 'traefik.http.services.adminer.loadbalancer.server.port=8080'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

networks:
  xavia_default:
    external: true
