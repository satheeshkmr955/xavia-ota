services:
  xavia-ota-postgres:
    image: postgres:14
    env_file: ../../.env
    container_name: xavia-ota-postgres
    networks:
      - xavia_default
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  xavia_default:
    external: true
