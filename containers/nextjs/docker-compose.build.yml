services:
  xavia-ota-nextjs:
    build:
      context: ../../
      dockerfile: containers/nextjs/Dockerfile
    image: ${IMAGE_NAME}:${APP_VERSION}
    container_name: xavia-ota-nextjs
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3001/api/health']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - '3001:3001'
